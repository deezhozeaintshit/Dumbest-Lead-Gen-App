    <script>
      // Immediate protection against third-party wallet extension collisions and fetch getter issues
      (function () {
        var isTargetError = function (val) {
          if (!val) return false;
          var str = '';
          if (typeof val === 'string') {
            str = val;
          } else if (typeof val === 'object') {
            str = (val.message || '') + ' ' + (val.stack || '') + ' ' + (val.name || '');
            try {
              str += ' ' + JSON.stringify(val);
            } catch (_) {}
          } else {
            str = String(val);
          }
          return (
            str.indexOf('ethereum') !== -1 ||
            str.indexOf('Cannot redefine property') !== -1 ||
            (str.indexOf('fetch') !== -1 && str.indexOf('getter') !== -1) ||
            str.indexOf('[vite]') !== -1 ||
            str.indexOf('failed to connect to websocket') !== -1 ||
            str.indexOf('websocket') !== -1
          );
        };

        // 1. Intercept uncaught errors
        var prevOnError = window.onerror;
        window.onerror = function (msg, source, lineno, colno, error) {
          if (
            isTargetError(msg) ||
            isTargetError(error) ||
            isTargetError(source)
          ) {
            return true; // suppress error
          }
          if (prevOnError) {
            return prevOnError.apply(this, arguments);
          }
        };

        window.addEventListener(
          'error',
          function (e) {
            if (
              e &&
              (isTargetError(e.message) ||
                isTargetError(e.filename) ||
                isTargetError(e.error))
            ) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (e) {
            if (e && isTargetError(e.reason)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );

        // 2. Filter console noise from wallet extensions or Vite websocket notices
        try {
          var methods = ['error', 'warn', 'log', 'info', 'debug'];
          for (var i = 0; i < methods.length; i++) {
            (function (m) {
              var orig = console[m];
              if (!orig) return;
              console[m] = function () {
                for (var j = 0; j < arguments.length; j++) {
                  if (isTargetError(arguments[j])) {
                    return;
                  }
                }
                orig.apply(console, arguments);
              };
            })(methods[i]);
          }
        } catch (_) {}

        // 3. Prevent "Cannot redefine property: ethereum" thrown by conflicting Web3 wallet extensions
        try {
          var origDefineProperty = Object.defineProperty;
          Object.defineProperty = function (obj, prop, descriptor) {
            if (obj === window && prop === 'ethereum') {
              try {
                var existing = Object.getOwnPropertyDescriptor(window, 'ethereum');
                if (existing && !existing.configurable) {
                  return obj;
                }
              } catch (_) {}
            }
            try {
              return origDefineProperty.call(Object, obj, prop, descriptor);
            } catch (err) {
              if (
                prop === 'ethereum' ||
                (err && isTargetError(err.message))
              ) {
                return obj;
              }
              throw err;
            }
          };

          var _eth;
          var ethDesc = Object.getOwnPropertyDescriptor(window, 'ethereum');
          if (!ethDesc || ethDesc.configurable) {
            Object.defineProperty(window, 'ethereum', {
              get: function () {
                return _eth;
              },
              set: function (val) {
                _eth = val;
              },
              configurable: true,
              enumerable: true,
            });
          }
        } catch (_) {}

        // 4. Patch window.fetch prototype chain and window instance
        try {
          var win = typeof window !== 'undefined' ? window : globalThis;
          if (!win) return;

          var currentFetch = win.fetch;

          function defineAccessor(target) {
            if (!target) return false;
            try {
              var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
              if (desc && (desc.configurable || (desc.get && !desc.set))) {
                Object.defineProperty(target, 'fetch', {
                  get: function () {
                    return currentFetch;
                  },
                  set: function (val) {
                    currentFetch = val;
                  },
                  configurable: true,
                  enumerable: desc.enumerable !== false,
                });
                return true;
              }
            } catch (err) {}
            return false;
          }

          var p = win;
          while (p) {
            defineAccessor(p);
            p = Object.getPrototypeOf(p);
          }

          if (typeof Window !== 'undefined' && Window.prototype) {
            defineAccessor(Window.prototype);
            var winProto = Object.getPrototypeOf(Window.prototype);
            if (winProto) defineAccessor(winProto);
          }

          try {
            Object.defineProperty(win, 'fetch', {
              get: function () {
                return currentFetch;
              },
              set: function (val) {
                currentFetch = val;
              },
              configurable: true,
              enumerable: true,
            });
          } catch (e) {}
        } catch (e) {}
      })();
    </script>
