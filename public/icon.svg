<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="funnelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#3b82f6" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Subtle grid dots or ambient ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 8" stroke-opacity="0.25"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Funnel / Lead pipeline icon with glow -->
  <g filter="url(#glow)">
    <!-- Top funnel wide bar -->
    <path d="M 128 140 L 384 140 C 392 140 398 146 394 154 L 308 268 C 304 274 300 280 300 288 L 300 376 C 300 384 292 390 284 386 L 228 356 C 220 352 216 346 216 338 L 216 288 C 216 280 212 274 208 268 L 122 154 C 118 146 124 140 128 140 Z" fill="url(#funnelGrad)" opacity="0.95"/>

    <!-- Lightning / enrichment spark in funnel -->
    <path d="M 268 160 L 236 220 L 260 220 L 244 280 L 284 210 L 258 210 Z" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Lead Ingestion Nodes at Top -->
  <circle cx="170" cy="116" r="14" fill="#38bdf8"/>
  <circle cx="256" cy="100" r="16" fill="#60a5fa"/>
  <circle cx="342" cy="116" r="14" fill="#818cf8"/>

  <line x1="170" y1="130" x2="190" y2="140" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>
  <line x1="256" y1="116" x2="256" y2="140" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>
  <line x1="342" y1="130" x2="322" y2="140" stroke="#818cf8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Output Gold Node at Bottom -->
  <circle cx="256" cy="424" r="18" fill="#fbbf24"/>
  <circle cx="256" cy="424" r="26" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4 4"/>
</svg>
