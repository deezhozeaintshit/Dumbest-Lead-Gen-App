app = "b2b-lead-pipeline" # Replace with your chosen unique app name
primary_region = "ord"    # Pick closest region: ord (Chicago), iad (Virginia), sjc (San Jose), fra (Frankfurt)

[build]

# Mount persistent storage for your SQLite database
[mounts]
  source = "sqlite_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"   # Automatically pauses VM when idle (saves memory/compute)
  auto_start_machines = true    # Wakes VM up in ~300ms when traffic hits the URL
  min_machines_running = 0      # Scale to 0 allowed (free tier friendly)
  processes = ["app"]

# Free Tier VM Specifications
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"              # 512MB RAM gives plenty of headroom for Express & Prisma
  cpus = 1
