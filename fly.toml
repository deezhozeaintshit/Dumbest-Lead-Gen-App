# fly.toml configuration file for B2B Lead Ingestion & Enrichment Pipeline
app = "b2b-lead-pipeline"
primary_region = "ord"

[build]

# Mount persistent volume for SQLite database file
[mounts]
  source = "sqlite_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
